server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # Static assets and SPA routing
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API
    # Deferred runtime resolution prevents startup failure when running standalone
    location /api/ {
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $backend_target "${BACKEND_URL}";

        if ($backend_target = "") {
            default_type application/json;
            return 404 '{"detail": "API proxy is disabled or BACKEND_URL is not configured"}';
        }
        if ($backend_target = "off") {
            default_type application/json;
            return 404 '{"detail": "API proxy is disabled"}';
        }

        proxy_pass $backend_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
